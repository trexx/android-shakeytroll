name: CI

# Lint, unit tests and a debug APK on every push / pull request so breakages are caught early.
# Release APKs are produced by release.yml (on tags / manual run).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: trexx/actions/.github/actions/checkout@main

      # compileSdk 37 needs platforms;android-37.0, and AGP builds with build-tools 36.0.0
      # (its default, not the newest published). Installing them up front pins what CI compiles against.
      - name: Set up Android build
        uses: trexx/actions/.github/actions/setup-android@main
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Lint, unit tests, debug APK
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload lint report
        if: failure()
        uses: trexx/actions/.github/actions/upload-artifact@main
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
